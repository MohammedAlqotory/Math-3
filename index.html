<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Math 3 |3 منصة رياضيات </title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.75);
            --primary: #38bdf8;
            --accent: #a855f7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 75%, #050811 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: calc(100vh - 30px);
            display: flex;
            flex-direction: column;
        }
        .screen {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 25px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            animation: fadeIn 0.35s ease;
            width: 100%;
        }
        .active { display: block; }
        #welcome-screen.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            padding: 60px 25px;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        h1.hero-title {
            color: var(--primary);
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 30px;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.45);
        }
        h2 { color: #f8fafc; font-size: 1.8rem; margin-bottom: 25px; text-align: center; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(2, 132, 199, 0.5); }
        .btn-center { display: flex; justify-content: center; }
        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
            padding: 9px 20px;
            font-size: 0.95rem;
        }
        .branches-grid, .lectures-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 12px 30px rgba(56, 189, 248, 0.2); }
        .content-box {
            background: rgba(15, 23, 42, 0.9);
            border-right: 4px solid var(--primary);
            border-radius: 14px;
            padding: 22px 18px;
            margin-bottom: 18px;
            line-height: 1.85;
        }
        .example-box {
            background: rgba(6, 78, 59, 0.15);
            border: 1px solid #10b981;
            border-radius: 14px;
            padding: 22px 18px;
            margin-top: 18px;
            line-height: 1.85;
        }
        .math-block {
            direction: ltr !important;
            overflow-x: auto;
            padding: 8px 0;
            text-align: center;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        .info-table th, .info-table td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            text-align: center;
        }
        .info-table th { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
        @media (max-width: 650px) {
            .branches-grid, .lectures-grid { grid-template-columns: 1fr; }
            h1.hero-title { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. شاشة البداية -->
    <div id="welcome-screen" class="screen active">
        <h1 class="hero-title">MATH 3 📐</h1>
        <div class="btn-center">
            <button class="btn" onclick="showScreen('branches-screen')">🚀 التالي (Next)</button>
        </div>
    </div>

    <!-- 2. شاشة الفروع -->
    <div id="branches-screen" class="screen">
        <h2>اختر المسار الدراسي (Branch)</h2>
        <div class="branches-grid">
            <div class="card" onclick="openBranch('b1')">
                <h3 style="color: var(--primary);">🌀 الفرع الأول</h3>
                <h4 style="color:#e2e8f0; margin-top:8px;">Multivariable Calculus</h4>
            </div>
            <div class="card" onclick="openBranch('b2')">
                <h3 style="color: var(--accent);">⚡ الفرع الثاني</h3>
                <h4 style="color:#e2e8f0; margin-top:8px;">Differential Equations</h4>
            </div>
        </div>
        <div class="btn-center">
            <button class="btn btn-back" onclick="showScreen('welcome-screen')">⬅ العودة للرئيسية</button>
        </div>
    </div>

    <!-- 3. شاشة قائمة محاضرات الفرع -->
    <div id="lectures-list-screen" class="screen">
        <button class="btn btn-back" onclick="showScreen('branches-screen')">⬅ رجوع لقائمة الفروع</button>
        <h2 id="branch-title">المحاضرات</h2>
        <div id="lectures-container" class="lectures-grid"></div>
    </div>

    <!-- 4. شاشة عرض تفاصيل المحاضرة المختارة -->
    <div id="lecture-screen" class="screen">
        <button class="btn btn-back" onclick="showScreen('lectures-list-screen')">⬅ رجوع لقائمة المحاضرات</button>
        <div id="lecture-body"></div>
    </div>
</div>

<!-- تحميل ملفات المحاضرات المنفصلة -->
<script src="lectures/b1_lec1.js"></script>
<script src="lectures/b2_lec1.js"></script>
<script>
    const registeredLectures = { b1: [], b2: [] };

    // دالة لتسجيل كل محاضرة من ملفها الخاص
    function registerLecture(branchKey, lectureData) {
        registeredLectures[branchKey].push(lectureData);
    }

    let currentBranch = 'b1';

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.renderMathInElement) {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ],
                throwOnError: false
            });
        }
    }

    function openBranch(branchKey) {
        currentBranch = branchKey;
        const titleElem = document.getElementById('branch-title');
        titleElem.innerText = branchKey === 'b1' ? '🌀 Multivariable Calculus' : '⚡ Differential Equations';

        const listContainer = document.getElementById('lectures-container');
        listContainer.innerHTML = '';

        const lecs = registeredLectures[branchKey];
        if (lecs.length === 0) {
            listContainer.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">لا توجد محاضرات مضافة حتى الآن في هذا الفرع.</p>';
        } else {
            lecs.forEach((lec, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3 style="color:var(--primary);">${lec.title}</h3><p style="color:var(--text-muted); margin-top:8px;">${lec.subtitle}</p>`;
                card.onclick = () => showLecture(lec);
                listContainer.appendChild(card);
            });
        }
        showScreen('lectures-list-screen');
    }

    function showLecture(lec) {
        const body = document.getElementById('lecture-body');
        body.innerHTML = lec.contentHtml;
        showScreen('lecture-screen');
    }
</script>
</body>
</html>
